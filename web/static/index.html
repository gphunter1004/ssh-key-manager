<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH Key Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>SSH Key Manager</h1>
    <div id="error-display"></div>

    <div id="auth-section">
        <div id="login-view">
            <div class="form-container">
                <h2>로그인</h2>
                <form id="login-form">
                    <div class="form-group"><label for="login-username">사용자명</label><input type="text" id="login-username" name="username" required></div>
                    <div class="form-group"><label for="login-password">비밀번호</label><input type="password" id="login-password" name="password" required></div>
                    <button type="submit">로그인</button>
                </form>
                <p class="toggle-link">계정이 없으신가요? <a href="#" id="show-register">가입하기</a></p>
            </div>
        </div>
        <div id="register-view" class="hidden">
            <div class="form-container">
                <h2>회원가입</h2>
                <form id="register-form">
                    <div class="form-group"><label for="register-username">사용자명</label><input type="text" id="register-username" name="username" required></div>
                    <div class="form-group"><label for="register-password">비밀번호</label><input type="password" id="register-password" name="password" required></div>
                    <button type="submit">가입하기</button>
                </form>
                <p class="toggle-link">이미 계정이 있으신가요? <a href="#" id="show-login">로그인하기</a></p>
            </div>
        </div>
    </div>

    <div id="key-section" class="hidden">
        <header class="header-section">
             <div class="nav-buttons">
                <button id="nav-keys" class="nav-btn active">🔑 내 키 관리</button>
                <button id="nav-servers" class="nav-btn">🖥️ 서버 관리</button>
                <button id="nav-users" class="nav-btn">👥 사용자 목록</button>
                <button id="nav-profile" class="nav-btn">👤 프로필</button>
            </div>
            <button id="logout-btn">로그아웃</button>
        </header>

        <div id="keys-view" class="view-section"></div>
        <div id="users-view" class="view-section hidden"></div>
        <div id="profile-view" class="view-section hidden"></div>

        <div id="servers-view" class="view-section hidden">
            <div class="action-bar">
                <h3>서버 관리</h3>
                <div class="action-buttons">
                    <button data-action="server-create-form" class="btn-primary">서버 추가</button>
                    <button data-action="deploy-all-keys" class="btn-success">전체 키 배포</button>
                </div>
            </div>
            <div id="server-form-modal" class="form-container hidden">
                </div>
            <div id="servers-list" class="cards-container"></div>
        </div>
    </div>
</div>

<div id="user-detail-modal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header"><h3>상세 정보</h3><button class="close" data-action="close-modal">&times;</button></div>
        <div class="modal-content-area" id="user-detail-content"></div>
    </div>
</div>

<div id="deploy-modal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header"><h3>키 배포 결과</h3><button class="close" data-action="close-modal">&times;</button></div>
        <div class="modal-content-area" id="deploy-content"></div>
    </div>
</div>

<div id="server-edit-modal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3>서버 정보 수정</h3>
            <button class="close" data-action="close-modal">&times;</button>
        </div>
        <div class="modal-content-area" id="server-edit-content">
            </div>
    </div>
</div>


<script src="js/utils.js"></script>
<script src="js/modal-manager.js"></script>
<script src="js/copy-manager.js"></script>
<script src="js/auth-manager.js"></script>
<script src="js/view-manager.js"></script>
<script src="js/key-manager.js"></script>
<script src="js/user-manager.js"></script>
<script src="js/profile-manager.js"></script>
<script src="js/server-manager.js"></script>
<script src="script.js"></script>

</body>
</html>
