<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH Key Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>SSH Key Manager</h1>

    <div id="error-display"></div>

    <div id="auth-section">
        <div id="login-view">
            <div class="form-container">
                <h2>로그인</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-username">사용자명</label>
                        <input type="text" id="login-username" name="username" placeholder="사용자명을 입력하세요" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">비밀번호</label>
                        <input type="password" id="login-password" name="password" placeholder="비밀번호를 입력하세요" required>
                    </div>
                    <button type="submit">로그인</button>
                </form>
                <p class="toggle-link">
                    계정이 없으신가요? <a href="#" id="show-register">가입하기</a>
                </p>
            </div>
        </div>

        <div id="register-view" class="hidden">
            <div class="form-container">
                <h2>회원가입</h2>
                <form id="register-form">
                    <div class="form-group">
                        <label for="register-username">사용자명</label>
                        <input type="text" id="register-username" name="username" placeholder="사용할 사용자명을 입력하세요" required>
                    </div>
                    <div class="form-group">
                         <label for="register-password">비밀번호</label>
                        <input type="password" id="register-password" name="password" placeholder="사용할 비밀번호를 입력하세요" required>
                    </div>
                    <button type="submit">가입하기</button>
                </form>
                <p class="toggle-link">
                    이미 계정이 있으신가요? <a href="#" id="show-login">로그인하기</a>
                </p>
            </div>
        </div>
    </div>

    <div id="key-section" class="hidden">
        <header class="header-section">
            <div class="nav-buttons">
                <button id="nav-keys" class="nav-btn active">🔑 내 키 관리</button>
                <button id="nav-servers" class="nav-btn">🖥️ 서버 관리</button>
                <button id="nav-users" class="nav-btn">👥 사용자 목록</button>
                <button id="nav-profile" class="nav-btn">👤 프로필</button>
                <button id="nav-departments" class="nav-btn" style="display: none;">🏢 부서 관리</button>
            </div>
            <button id="logout-btn">로그아웃</button>
        </header>

        <div id="keys-view" class="view-section">
            <div class="action-bar">
                <h3>SSH 키 관리</h3>
                <div class="action-buttons">
                    <button data-action="key-create" class="btn-primary">키 생성/재생성</button>
                    <button data-action="key-view" class="btn-secondary">키 보기</button>
                    <button data-action="key-delete" class="btn-danger">키 삭제</button>
                </div>
            </div>
            <div id="key-info"></div>
            <div id="key-display-area" class="hidden">
                </div>
        </div>

        <div id="servers-view" class="view-section hidden">
            <div class="action-bar">
                <h3>서버 관리</h3>
                <div class="action-buttons">
                     <button data-action="server-create" class="btn-primary">서버 추가</button>
                </div>
            </div>
             <div id="servers-list" class="cards-container">
                <div class="empty-state">등록된 서버가 없습니다. '서버 추가' 버튼을 눌러 시작하세요.</div>
             </div>
        </div>

        <div id="users-view" class="view-section hidden">
            <h2>사용자 목록</h2>
            <div class="stats-section">
                <div class="stat-item">
                    <span class="stat-label">전체 사용자</span>
                    <span id="total-users" class="stat-value">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">키 보유 사용자</span>
                    <span id="users-with-keys" class="stat-value">-</span>
                </div>
            </div>
            <div id="users-list" class="users-list">
                </div>
        </div>

        <div id="profile-view" class="view-section hidden">
            <h2>프로필 관리</h2>
            <div id="current-user-info">
                </div>
            <div class="form-container" style="margin-top: 2rem;">
                 <h3>프로필 업데이트</h3>
                <form id="profile-form">
                    <div class="form-group">
                        <label for="profile-username">사용자명</label>
                        <input type="text" id="profile-username" name="username">
                    </div>
                    <div class="form-group">
                        <label for="profile-password">새 비밀번호 (선택)</label>
                        <input type="password" id="profile-password" name="password" placeholder="변경할 경우에만 입력">
                    </div>
                    <button type="submit" class="btn-primary">업데이트</button>
                </form>
            </div>
        </div>
        
        <div id="departments-view" class="view-section hidden">
             <h2>부서 관리</h2>
             <div class="empty-state">부서 관리 기능은 현재 개발 중입니다.</div>
        </div>
    </div>
</div>

<div id="user-detail-modal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3>상세 정보</h3>
            <button class="close" data-action="close-modal">&times;</button>
        </div>
        <div class="modal-content-area" id="user-detail-content">
            </div>
    </div>
</div>

<div id="deploy-modal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3>키 배포</h3>
            <button class="close" data-action="close-modal">&times;</button>
        </div>
        <div class="modal-content-area" id="deploy-content">
            </div>
    </div>
</div>


<script src="js/utils.js"></script>
<script src="js/modal-manager.js"></script>
<script src="js/copy-manager.js"></script>
<script src="js/view-manager.js"></script>
<script src="js/auth-manager.js"></script>
<script src="js/key-manager.js"></script>
<script src="js/user-manager.js"></script>
<script src="js/profile-manager.js"></script>
<script src="script.js"></script>

</body>
</html>
